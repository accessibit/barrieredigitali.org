services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: barriere
      POSTGRES_PASSWORD: barriere
      POSTGRES_DB: barriere
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barriere -d barriere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
